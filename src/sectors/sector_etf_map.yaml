# null 表示该板块在当前 ETF 快照中找不到对应的 ETF（如算力、CXO、铜等）。
# 主板块不在此映射，其涨跌幅由子板块聚合得出。
#
# 说明: 本映射表在代码运行时直接使用，板块涨跌幅不依赖名称模糊匹配。

